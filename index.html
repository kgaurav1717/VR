<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE LAST BREW — WebXR Detective Investigation</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #070b12;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #e8edf5;
    }
    #hud-overlay {
      position: fixed; top: 14px; left: 14px; z-index: 20;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      pointer-events: auto;
    }
    .hud-pill {
      background: rgba(11, 17, 28, 0.88);
      border: 1px solid rgba(212, 163, 89, 0.45);
      color: #f3e9d2; padding: 7px 12px; border-radius: 6px;
      font-size: 13px; letter-spacing: 0.4px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .hud-btn {
      background: #182338; color: #f6d594;
      border: 1px solid #d4a359; border-radius: 6px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
      transition: background 0.15s;
    }
    .hud-btn:hover { background: #263654; }
    #crosshair {
      position: fixed; top: 50%; left: 50%;
      width: 10px; height: 10px; margin: -5px 0 0 -5px;
      border: 2px solid rgba(246, 213, 148, 0.85);
      border-radius: 50%; pointer-events: none; z-index: 15;
    }
    #desktop-hint {
      position: fixed; bottom: 14px; left: 14px; z-index: 20;
      background: rgba(11, 17, 28, 0.85);
      border: 1px solid rgba(140, 165, 200, 0.3);
      padding: 8px 13px; border-radius: 6px; font-size: 12px; color: #b8c7dc;
    }
    /* High-DPI Interactive Modal Overlay (works in Desktop & mirrors cleanly to VR world-space) */
    #modal-backdrop {
      position: fixed; inset: 0; background: rgba(4, 7, 13, 0.72);
      display: none; align-items: center; justify-content: center;
      z-index: 50; padding: 18px;
    }
    #modal-card {
      width: min(940px, 95vw); max-height: 88vh; overflow-y: auto;
      background: linear-gradient(180deg, #101826 0%, #0b111c 100%);
      border: 1px solid #c99649; border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.85);
      padding: 22px 26px; color: #e9eef7;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(201,150,73,0.35);
      padding-bottom: 12px; margin-bottom: 16px;
    }
    .modal-title { font-size: 20px; font-weight: 700; color: #f7d594; letter-spacing: 0.8px; }
    .modal-sub { font-size: 12px; color: #9fb2cc; text-transform: uppercase; letter-spacing: 1px; }
    .close-btn {
      background: #471d22; color: #ffd6d6; border: 1px solid #b84a55;
      padding: 6px 14px; border-radius: 6px; font-weight: 600; cursor: pointer;
    }
    .close-btn:hover { background: #692830; }
    .dossier-paper {
      background: #f2ead9; color: #1d1b18; padding: 18px 20px;
      border-radius: 6px; font-family: 'Georgia', serif; line-height: 1.58;
      box-shadow: inset 0 0 24px rgba(120, 95, 55, 0.22);
      margin-bottom: 14px;
    }
    .dossier-paper h3 { margin: 0 0 8px 0; color: #3b2313; border-bottom: 1px solid #c4b393; padding-bottom: 4px; }
    .clue-tag {
      display: inline-block; padding: 3px 8px; margin: 3px 4px 3px 0;
      border-radius: 4px; font-size: 12px; font-family: 'Segoe UI', sans-serif;
      cursor: pointer; border: 1px solid #8a6d3b; background: #fff9eb; color: #3d2b10;
    }
    .clue-tag.bookmarked { background: #8f2424; color: #fff; border-color: #ff9c9c; }
    .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .action-btn {
      background: #1f3352; color: #f6e1b5; border: 1px solid #c99649;
      padding: 9px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .action-btn:hover { background: #2d4873; }
    .action-btn.primary { background: #7a2323; border-color: #e07a7a; color: #fff; }
    .action-btn.primary:hover { background: #9c2c2c; }
    .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    input[type="text"], select {
      background: #0c1320; color: #f5e6c8; border: 1px solid #c99649;
      padding: 8px 12px; border-radius: 6px; font-size: 15px;
    }
    .cipher-box {
      background: #090e17; border: 1px solid #3f5578; border-radius: 6px;
      padding: 12px 14px; font-family: 'Courier New', monospace;
      color: #a9d6ff; font-size: 15px; line-height: 1.6; margin: 10px 0;
      word-break: break-word;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .suspect-card {
      background: #131e30; border: 2px solid #344a6e; border-radius: 8px;
      padding: 14px; cursor: pointer; transition: border-color 0.15s, transform 0.15s;
    }
    .suspect-card:hover { border-color: #c99649; }
    .suspect-card.selected { border-color: #e05353; background: #261620; }
    .feedback-banner {
      padding: 12px 14px; border-radius: 6px; margin-top: 12px; font-weight: 600;
    }
    .feedback-ok { background: #143d29; border: 1px solid #48c78e; color: #b9f6ca; }
    .feedback-err { background: #45161b; border: 1px solid #f14668; color: #ffd1d9; }
    .ref-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
      gap: 5px; max-height: 170px; overflow-y: auto;
      background: #080c14; padding: 8px; border-radius: 6px; border: 1px solid #2e405e;
      font-family: monospace; font-size: 12px;
    }
    .ref-cell { background: #131c2e; padding: 4px 6px; border-radius: 4px; text-align: center; }
  </style>
</head>
<body>

  <!-- Desktop / Quick HUD -->
  <div id="hud-overlay">
    <div class="hud-pill" id="hud-phase">PHASE 1: ARRIVAL</div>
    <div class="hud-pill" id="hud-progress">PROGRESS: 0%</div>
    <button class="hud-btn" onclick="Game.openNarrationModal()">Briefing</button>
    <button class="hud-btn" onclick="Game.openFile('case', 0)">File 1: The Last Brew</button>
    <button class="hud-btn" onclick="Game.openFile('witness', 0)">File 2: Witness Statements</button>
    <button class="hud-btn" id="btn-task1" onclick="Game.openTaskOne()">Task 01: Time of Death</button>
    <button class="hud-btn" id="btn-evidence" onclick="Game.openEvidenceHub()" style="display:none;">Exhibits (A–E)</button>
    <button class="hud-btn" id="btn-task2" onclick="Game.openTaskTwo()" style="display:none;">Task 02: Accusation</button>
    <button class="hud-btn" onclick="Game.toggleAudio()" id="btn-audio">Audio: ON</button>
    <button class="hud-btn" onclick="Game.toggleSeated()" id="btn-seated">Seated: OFF</button>
  </div>

  <div id="crosshair"></div>
  <div id="desktop-hint">
    Desktop: <b>WASD</b> Move | <b>Drag Mouse</b> Look | <b>Click</b> Objects/Board | <b>1</b> Case File | <b>2</b> Witnesses | <b>ESC</b> Close/Pause | Quest 3S: Click <b>VR</b> bottom-right
  </div>

  <!-- Interactive Document / Puzzle / Accusation Overlay -->
  <div id="modal-backdrop">
    <div id="modal-card">
      <div class="modal-header">
        <div>
          <div class="modal-sub" id="modal-kicker">DETECTIVE TERMINAL</div>
          <div class="modal-title" id="modal-title">Title</div>
        </div>
        <button class="close-btn" onclick="Game.closeModal()">CLOSE [ESC]</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- A-FRAME 3D / WEBXR SCENE -->
  <a-scene
    id="vr-scene"
    background="color: #060911"
    fog="type: exponential; color: #080d18; density: 0.045"
    renderer="antialias: true; colorManagement: true; highRefreshRate: true"
    webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking"
  >
    <a-assets>
      <canvas id="tex-board-header" width="1024" height="128"></canvas>
      <canvas id="tex-folder-1" width="512" height="512"></canvas>
      <canvas id="tex-folder-2" width="512" height="512"></canvas>
      <canvas id="tex-photo-cafe" width="512" height="512"></canvas>
      <canvas id="tex-photo-victim" width="512" height="512"></canvas>
      <canvas id="tex-vr-panel" width="1400" height="900"></canvas>
    </a-assets>

    <!-- PLAYER RIG (Meta Quest 3S Touch Controllers + Desktop WASD/Mouse) -->
    <a-entity id="player-rig" position="0 0 1.45" vr-locomotion desktop-controls>
      <a-camera id="player-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 18">
        <a-cursor
          id="gaze-cursor"
          fuse="false"
          raycaster="objects: .interactable; far: 8"
          geometry="primitive: ring; radiusInner: 0.006; radiusOuter: 0.011"
          material="color: #f6d594; shader: flat; opacity: 0.85"
        ></a-cursor>
      </a-camera>

      <!-- Left Quest 3S Controller -->
      <a-entity
        id="left-hand"
        oculus-touch-controls="hand: left; model: true"
        laser-controls="hand: left"
        raycaster="objects: .interactable; far: 8; lineColor: #7aa8e8; lineOpacity: 0.75"
        vr-controller-helper="hand: left"
      ></a-entity>

      <!-- Right Quest 3S Controller -->
      <a-entity
        id="right-hand"
        oculus-touch-controls="hand: right; model: true"
        laser-controls="hand: right"
        raycaster="objects: .interactable; far: 8; lineColor: #f6d594; lineOpacity: 0.9"
        vr-controller-helper="hand: right"
      ></a-entity>
    </a-entity>

    <!-- LIGHTING (Moody Charcoal & Navy + Warm Amber Desk Lamp) -->
    <a-light type="ambient" color="#24324a" intensity="0.65"></a-light>
    <a-light type="directional" color="#5c79a6" intensity="0.45" position="-3 4 -2"></a-light>
    <a-light id="desk-lamp-light" type="point" color="#ffae52" intensity="1.85" distance="5.5" decay="1.6" position="-0.55 1.32 0.15"></a-light>
    <a-light type="point" color="#7d9cc9" intensity="0.65" distance="7" position="0 2.5 -1.6"></a-light>

    <!-- INVESTIGATION OFFICE ARCHITECTURE -->
    <a-entity id="office-room">
      <!-- Floor & Rug -->
      <a-plane rotation="-90 0 0" width="8" height="8" color="#12161f" roughness="0.85"></a-plane>
      <a-plane rotation="-90 0 0" position="0 0.005 0.3" width="4.2" height="3.2" color="#2b161a" roughness="0.95"></a-plane>
      <!-- Ceiling -->
      <a-plane rotation="90 0 0" position="0 3.2 0" width="8" height="8" color="#0b0f17"></a-plane>
      <!-- Walls -->
      <a-box position="0 1.6 -2.4" width="8" height="3.2" depth="0.15" color="#141c29"></a-box>
      <a-box position="0 1.6 3.6" width="8" height="3.2" depth="0.15" color="#111824"></a-box>
      <a-box position="-3.4 1.6 0.6" width="0.15" height="3.2" depth="6.2" color="#121a26"></a-box>
      <a-box position="3.4 1.6 0.6" width="0.15" height="3.2" depth="6.2" color="#121a26"></a-box>

      <!-- Rainy Night Window on Left Wall -->
      <a-entity id="rain-window" position="-3.31 1.65 0.2" rotation="0 90 0">
        <a-plane width="2.2" height="1.5" color="#081221" material="emissive: #0c1d36; emissiveIntensity: 0.7"></a-plane>
        <!-- Window Mullions -->
        <a-box position="0 0 0.02" width="2.28" height="0.07" color="#1c1512"></a-box>
        <a-box position="0 0 0.02" width="0.07" height="1.56" color="#1c1512"></a-box>
        <a-box position="0 0.76 0.02" width="2.32" height="0.09" color="#1c1512"></a-box>
        <a-box position="0 -0.76 0.02" width="2.32" height="0.09" color="#1c1512"></a-box>
        <!-- Animated Rain Streaks -->
        <a-entity id="rain-container" position="0 0 0.01"></a-entity>
      </a-entity>

      <!-- Bookshelf on Right Wall -->
      <a-entity position="3.05 0 0.4" rotation="0 -90 0">
        <a-box position="0 1.1 0" width="1.8" height="2.2" depth="0.38" color="#241711"></a-box>
        <a-box position="-0.4 0.55 0.05" width="0.7" height="0.24" depth="0.26" color="#4a1f24"></a-box>
        <a-box position="0.35 0.55 0.05" width="0.6" height="0.24" depth="0.26" color="#1d354d"></a-box>
        <a-box position="-0.2 1.15 0.05" width="0.9" height="0.26" depth="0.26" color="#3b2f21"></a-box>
        <a-box position="0.3 1.72 0.05" width="0.8" height="0.25" depth="0.26" color="#213b30"></a-box>
      </a-entity>
    </a-entity>

    <!-- WOODEN INVESTIGATION DESK -->
    <a-entity id="investigation-desk" position="0 0 0.25">
      <!-- Tabletop -->
      <a-box position="0 0.76 0" width="2.15" height="0.07" depth="1.05" color="#3b2416" roughness="0.55"></a-box>
      <!-- Desk Legs -->
      <a-box position="-0.96 0.375 -0.42" width="0.09" height="0.75" depth="0.09" color="#29180e"></a-box>
      <a-box position="0.96 0.375 -0.42" width="0.09" height="0.75" depth="0.09" color="#29180e"></a-box>
      <a-box position="-0.96 0.375 0.42" width="0.09" height="0.75" depth="0.09" color="#29180e"></a-box>
      <a-box position="0.96 0.375 0.42" width="0.09" height="0.75" depth="0.09" color="#29180e"></a-box>
      <!-- Modesty Panel -->
      <a-box position="0 0.48 -0.42" width="1.85" height="0.52" depth="0.04" color="#2d1b10"></a-box>

      <!-- Warm Banker's Desk Lamp -->
      <a-entity position="-0.72 0.8 -0.18">
        <a-cylinder radius="0.11" height="0.03" color="#b88b4a" metalness="0.7" roughness="0.3"></a-cylinder>
        <a-cylinder position="0 0.22 0" radius="0.018" height="0.42" color="#b88b4a" metalness="0.7"></a-cylinder>
        <a-cylinder position="0.06 0.42 0.05" rotation="0 0 -25" radius="0.13" height="0.16" color="#1e5c3a" material="emissive: #ffaa44; emissiveIntensity: 0.45"></a-cylinder>
      </a-entity>

      <!-- Notebook & Pen -->
      <a-entity position="0.68 0.805 0.16" rotation="0 -14 0" class="interactable" data-action="notes">
        <a-box width="0.24" height="0.02" depth="0.32" color="#1d2738"></a-box>
        <a-plane position="0 0.012 0" rotation="-90 0 0" width="0.21" height="0.29" color="#efe6d2"></a-plane>
        <a-cylinder position="0.15 0.015 0" rotation="90 12 0" radius="0.007" height="0.18" color="#c99649"></a-cylinder>
        <a-text value="DETECTIVE NOTES" position="0 0.016 -0.08" rotation="-90 0 0" align="center" color="#2c241b" width="0.42"></a-text>
      </a-entity>

      <!-- Crime Scene & Victim Photographs on Desk -->
      <a-entity position="-0.48 0.802 0.24" rotation="0 12 0" class="interactable" data-action="photo-cafe">
        <a-plane rotation="-90 0 0" width="0.26" height="0.22" material="src: #tex-photo-cafe"></a-plane>
      </a-entity>
      <a-entity position="-0.22 0.804 0.30" rotation="0 -8 0" class="interactable" data-action="photo-victim">
        <a-plane rotation="-90 0 0" width="0.22" height="0.26" material="src: #tex-photo-victim"></a-plane>
      </a-entity>

      <!-- FILE 1: THE LAST BREW (Physical Interactive Folder) -->
      <a-entity id="folder-case" position="-0.16 0.812 -0.02" rotation="0 6 0" class="interactable hover-glow" data-action="file-case">
        <a-box width="0.34" height="0.024" depth="0.44" color="#b88946"></a-box>
        <a-plane position="0 0.013 0" rotation="-90 0 0" width="0.32" height="0.42" material="src: #tex-folder-1"></a-plane>
      </a-entity>

      <!-- FILE 2: WITNESS STATEMENT (Physical Interactive Folder) -->
      <a-entity id="folder-witness" position="0.26 0.812 -0.04" rotation="0 -7 0" class="interactable hover-glow" data-action="file-witness">
        <a-box width="0.34" height="0.024" depth="0.44" color="#8f3932"></a-box>
        <a-plane position="0 0.013 0" rotation="-90 0 0" width="0.32" height="0.42" material="src: #tex-folder-2"></a-plane>
      </a-entity>

      <!-- RECOVERED EVIDENCE TRAY (Appears prominently after Task 01, also inspectable) -->
      <a-entity id="evidence-tray" position="0 0.805 -0.32" visible="false">
        <a-box width="0.95" height="0.03" depth="0.24" color="#1b2433"></a-box>
        <a-box position="-0.36 0.025 0" width="0.16" height="0.02" depth="0.16" color="#d9c69e" class="interactable hover-glow" data-action="exhibit-A">
          <a-text value="EXHIBIT A\nASCII" position="0 0.012 0" rotation="-90 0 0" align="center" color="#111" width="0.35"></a-text>
        </a-box>
        <a-box position="-0.18 0.025 0" width="0.16" height="0.02" depth="0.16" color="#c7d6e8" class="interactable hover-glow" data-action="exhibit-B">
          <a-text value="EXHIBIT B\nMORSE" position="0 0.012 0" rotation="-90 0 0" align="center" color="#111" width="0.35"></a-text>
        </a-box>
        <a-box position="0 0.025 0" width="0.16" height="0.02" depth="0.16" color="#e3b6b6" class="interactable hover-glow" data-action="exhibit-C">
          <a-text value="EXHIBIT C\nPIGPEN" position="0 0.012 0" rotation="-90 0 0" align="center" color="#111" width="0.35"></a-text>
        </a-box>
        <a-box position="0.18 0.025 0" width="0.16" height="0.02" depth="0.16" color="#c9e3c5" class="interactable hover-glow" data-action="exhibit-D">
          <a-text value="EXHIBIT D\nREVERSE" position="0 0.012 0" rotation="-90 0 0" align="center" color="#111" width="0.35"></a-text>
        </a-box>
        <a-box position="0.36 0.025 0" width="0.16" height="0.02" depth="0.16" color="#f0d48b" class="interactable hover-glow" data-action="exhibit-E">
          <a-text value="EXHIBIT E\nCIPHER KEY\n& LOGS" position="0 0.012 0" rotation="-90 0 0" align="center" color="#111" width="0.32"></a-text>
        </a-box>
      </a-entity>
    </a-entity>

    <!-- WALL-MOUNTED INTERACTIVE EVIDENCE BOARD -->
    <a-entity id="evidence-board" position="0 1.68 -2.30">
      <!-- Cork & Wood Frame -->
      <a-box width="3.55" height="1.85" depth="0.06" color="#2e1b10"></a-box>
      <a-plane position="0 0 0.032" width="3.38" height="1.68" color="#5c432c" roughness="0.9"></a-plane>
      <a-plane position="0 0.74 0.036" width="3.25" height="0.16" material="src: #tex-board-header"></a-plane>

      <!-- Board Instructions & Action Buttons -->
      <a-text
        id="board-status-text"
        value="EVIDENCE BOARD: Click two cards to link clues with red string | Click 'CLEAR STRINGS' to reset"
        position="-1.62 0.61 0.04" color="#f5e6c8" width="2.55"
      ></a-text>
      <a-box position="1.32 0.61 0.04" width="0.54" height="0.09" depth="0.02" color="#6e2323" class="interactable" data-action="clear-strings">
        <a-text value="CLEAR STRINGS" position="0 0 0.015" align="center" color="#fff" width="1.1"></a-text>
      </a-box>

      <!-- Container for Pinned Cards & Dynamic Red Strings -->
      <a-entity id="board-nodes" position="0 0 0.042"></a-entity>
      <a-entity id="board-strings" position="0 0 0.048"></a-entity>

      <!-- Board Console Buttons (Task 1, Exhibits, Task 2) -->
      <a-entity position="0 -0.73 0.045">
        <a-box position="-1.1 0 0" width="0.88" height="0.13" depth="0.03" color="#1d3557" class="interactable" data-action="open-task1">
          <a-text id="board-btn-t1" value="TASK 01: TIME OF MURDER" position="0 0 0.02" align="center" color="#f7d594" width="1.55"></a-text>
        </a-box>
        <a-box position="0 0 0" width="0.88" height="0.13" depth="0.03" color="#2a3b4c" class="interactable" data-action="open-exhibits">
          <a-text id="board-btn-ex" value="EXHIBITS & DECODERS" position="0 0 0.02" align="center" color="#a9d6ff" width="1.55"></a-text>
        </a-box>
        <a-box position="1.1 0 0" width="0.88" height="0.13" depth="0.03" color="#6b2126" class="interactable" data-action="open-task2">
          <a-text id="board-btn-t2" value="TASK 02: ACCUSATION" position="0 0 0.02" align="center" color="#ffd6d6" width="1.55"></a-text>
        </a-box>
      </a-entity>
    </a-entity>

    <!-- WORLD-SPACE VR READING PANEL (Mirrors active dossier/task directly in 3D space for Meta Quest 3S) -->
    <a-entity id="vr-world-panel" position="0 1.52 0.72" visible="false">
      <a-plane width="1.28" height="0.84" color="#0b111c" material="opacity: 0.96"></a-plane>
      <a-plane position="0 0 0.004" width="1.22" height="0.78" material="src: #tex-vr-panel; shader: flat"></a-plane>
      <!-- VR Panel Controls -->
      <a-box position="-0.44 -0.46 0.01" width="0.28" height="0.08" depth="0.02" color="#1f3352" class="interactable" data-action="vr-prev">
        <a-text value="PREV PAGE" position="0 0 0.015" align="center" color="#f6e1b5" width="0.85"></a-text>
      </a-box>
      <a-box position="-0.12 -0.46 0.01" width="0.28" height="0.08" depth="0.02" color="#1f3352" class="interactable" data-action="vr-next">
        <a-text value="NEXT PAGE" position="0 0 0.015" align="center" color="#f6e1b5" width="0.85"></a-text>
      </a-box>
      <a-box position="0.20 -0.46 0.01" width="0.28" height="0.08" depth="0.02" color="#2d4c3e" class="interactable" data-action="vr-action">
        <a-text id="vr-action-label" value="PROCEED" position="0 0 0.015" align="center" color="#d2f8e5" width="0.85"></a-text>

        document.getElementById("hud-progress").textContent = `PROGRESS: ${Math.min(100, pct)}%`;

        let phaseLabel = "PHASE 1: ARRIVAL";
        if (this.task2Solved) phaseLabel = "PHASE 7: CASE SOLVED";
        else if (this.task1Solved && pCount >= 3) phaseLabel = "PHASE 6: FINAL ACCUSATION";
        else if (this.task1Solved) phaseLabel = "PHASE 5: EVIDENCE DECODING";
        else if (this.readCase && this.readWitness) phaseLabel = "PHASE 4: TASK 01 — TIME OF DEATH";
        else if (this.readCase) phaseLabel = "PHASE 3: WITNESS STATEMENTS";
        else phaseLabel = "PHASE 2: CASE FILES";

        document.getElementById("hud-phase").textContent = phaseLabel;

        if (this.task1Solved) {
          document.getElementById("evidence-tray").setAttribute("visible", "true");
          document.getElementById("btn-evidence").style.display = "inline-block";
          document.getElementById("btn-task2").style.display = "inline-block";
          document.getElementById("board-btn-t1").setAttribute("value", "TASK 01: SOLVED (9:17-9:27)");
        }
        if (this.task2Solved) {
          document.getElementById("board-btn-t2").setAttribute("value", "CASE SOLVED: RISHABH");
        }

      /* Ambient Rain & Subtle Audio Synthesizer (No External Audio Files Needed) */
      toggleAudio() {
        this.audioEnabled = !this.audioEnabled;
        document.getElementById("btn-audio").textContent = `Audio: ${this.audioEnabled ? "ON" : "OFF"}`;
        if (!this.audioEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
      },

      initAudio() {
        if (this.audioCtx || !this.audioEnabled) return;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AC();
          // Gentle filtered pink/brown noise for rain ambience
          const bufferSize = 2 * this.audioCtx.sampleRate;
          const noiseBuffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            output[i] = (lastOut + (0.02 * white)) / 1.02;
            lastOut = output[i];
            output[i] *= 0.14;
          }
          const whiteNoise = this.audioCtx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;
          whiteNoise.loop = true;
          const filter = this.audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = 420;
          const gain = this.audioCtx.createGain();
          gain.gain.value = 0.25;
          whiteNoise.connect(filter);
          filter.connect(gain);
          gain.connect(this.audioCtx.destination);
          whiteNoise.start(0);
        } catch (e) {}
      },

      playClickSound(freq = 440) {
        if (!this.audioEnabled) return;
        this.initAudio();
        if (!this.audioCtx) return;
        try {
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
          gain.gain.setValueAtTime(0.06, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + 0.12);
        } catch (e) {}
      },

      speakNarration() {
        if (!this.audioEnabled || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(NARRATION_TEXT.join(" "));
        utter.rate = 0.94;
        utter.pitch = 0.9;
        window.speechSynthesis.speak(utter);
      },

      toggleSeated() {
        this.seatedMode = !this.seatedMode;
        const cam = document.getElementById("player-camera");
        cam.setAttribute("position", `0 ${this.seatedMode ? 1.22 : 1.6} 0`);
        document.getElementById("btn-seated").textContent = `Seated: ${this.seatedMode ? "ON" : "OFF"}`;
      },

      /* World-Space VR Canvas Mirroring (So Meta Quest 3S users see crisp readable panels in 3D) */
      renderVRWorldPanel(title, lines, actionLabel = "PROCEED", mode = "info", page = 0) {
        this.vrState = { mode, page };
        const panel = document.getElementById("vr-world-panel");
        panel.setAttribute("visible", "true");
        document.getElementById("vr-action-label").setAttribute("value", actionLabel);

        const canvas = document.getElementById("tex-vr-panel");
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f2ead9";
        ctx.fillRect(0, 0, 1400, 900);
        ctx.strokeStyle = "#5c3d1e";
        ctx.lineWidth = 14;
        ctx.strokeRect(12, 12, 1376, 876);

        ctx.fillStyle = "#2b1908";
        ctx.font = "bold 36px Georgia";
        ctx.fillText(title, 48, 72);
        ctx.fillStyle = "#8a6d3b";
        ctx.fillRect(48, 92, 1304, 3);

        ctx.fillStyle = "#1c1915";
        ctx.font = "26px Georgia";
        let y = 142;
        lines.forEach(rawLine => {
          const words = rawLine.split(" ");
          let line = "";
          for (let w of words) {
            const test = line + w + " ";
            if (ctx.measureText(test).width > 1290) {
              ctx.fillText(line, 48, y);
              line = w + " ";
              y += 36;
            } else {
              line = test;
            }
          }
          ctx.fillText(line, 48, y);
          y += 42;
        });

        const mesh = panel.querySelector("a-plane[material*='tex-vr-panel']");
        if (mesh && mesh.getObject3D("mesh") && mesh.getObject3D("mesh").material.map) {
          mesh.getObject3D("mesh").material.map.needsUpdate = true;
        }
      },

            <button class="action-btn" onclick="Game.inspectMorseErrors()">Analyze Transcription Errors</button>
          </div>
          <div id="morse-ref" class="ref-grid" style="display:none;margin-top:8px;">${morseMap.map(m => `<div class="ref-cell">${m}</div>`).join("")}</div>
          <div id="morse-diag" style="margin:8px 0;color:#8be9fd;font-size:13px;"></div>

          <input type="text" id="morse-input" style="width:100%;margin-bottom:8px;" placeholder="Enter reconstructed Morse message..." value="${this.puzzles.morse ? "KIRTI CAN'T EXPRESS EMOTIONS, SHE HAS ALEXITHYMIA." : ''}" />
          <button class="action-btn primary" onclick="Game.checkMorse()">Submit Reconstructed Message</button>
          <div id="morse-fb"></div>
          <div class="nav-row"><button class="action-btn" onclick="Game.openEvidenceHub()">&larr; Back to Exhibits</button></div>
        `;
        this.openModal("EXHIBIT B — MORSE DECODER", "ISHITA'S DIARY (OCTOBER 2, 2026)", html);
      },

      inspectMorseErrors() {
        document.getElementById("morse-diag").innerHTML =
          `Raw literal decode: <code>CIRTHI CAN[?] EXPAESS EMOTIONS, SHE HAS APEXITHWMIA</code> &rarr; Corrected word targets: <b>KIRTI CAN'T EXPRESS EMOTIONS, SHE HAS ALEXITHYMIA.</b>`;
        document.getElementById("morse-input").value = "KIRTI CAN'T EXPRESS EMOTIONS, SHE HAS ALEXITHYMIA.";
      },

      checkMorse() {
        const val = document.getElementById("morse-input").value.trim().toUpperCase().replace(/[^A-Z' ]/g, "");
        const fb = document.getElementById("morse-fb");
        if (val.includes("KIRTI") && val.includes("EXPRESS EMOTIONS") && val.includes("ALEXITHYMIA")) {
          this.puzzles.morse = true;
          this.playClickSound(660);
          this.updateHUD();
          fb.innerHTML = `<div class="feedback-banner feedback-ok">RECONSTRUCTED: "KIRTI CAN'T EXPRESS EMOTIONS, SHE HAS ALEXITHYMIA."<br/><span style="font-weight:normal;font-size:13px;">Note: Difficulty expressing emotion (alexithymia) explains Kirti's calm reaction, not guilt.</span></div>`;
        } else {
          fb.innerHTML = `<div class="feedback-banner feedback-err">Not quite. Use the Morse reference or Analyze button to resolve the transcription errors.</div>`;
        }
      },

      /* EXHIBIT C: PIGPEN CIPHER DECODER */
      renderExhibitC() {
        const keyCells = Object.entries(PIGPEN_SYMBOLS)
          .map(([letter, sym]) => `<div class="ref-cell" style="font-size:15px;"><b>${sym}</b> = ${letter}</div>`)
          .join("");
        const decodedPreview = EXHIBIT_C_LINES.map((ln, idx) => `Line ${idx + 1}: ${decodePigpenLine(ln)}`).join("\n");

        const html = `
          <div class="dossier-paper">
            <h3>EXHIBIT C — ISHITA'S DIARY ENTRY</h3>
            <p><b>Date:</b> October 18, 2026</p>
            <p>"Rishabh is different. He's always been intense, but lately he's been talking about 'unique minds' and 'the beauty of darkness.'<br/>
            He invited me to his house once, and I saw something weird."</p>
          </div>

          <div style="font-size:13px;color:#b8c7dc;">CUSTOM TRANSCRIBED PIGPEN SYMBOLS (LINES 1–11):</div>
          <div class="cipher-box" style="white-space:pre-line;font-size:16px;">${EXHIBIT_C_LINES.join("\n")}</div>

          <div class="nav-row">
            <button class="action-btn" onclick="Game.togglePigpenKey()">Toggle Recovered Notebook Key (Exhibit E)</button>
            <button class="action-btn" onclick="Game.applyPigpenKey()">Auto-Map Symbols with Key</button>
          </div>
          <div id="pigpen-key-box" class="ref-grid" style="display:none;margin-top:8px;">${keyCells}</div>
          <div id="pigpen-decoded-box" class="cipher-box" style="display:none;color:#98fb98;white-space:pre-line;">${decodedPreview}</div>

          <div style="margin-top:10px;">
            <div style="font-size:12px;color:#b8c7dc;margin-bottom:4px;">WHAT DOES THE DECODED PIGPEN CIPHER REVEAL ABOUT RISHABH?</div>
            <select id="pigpen-select" style="width:100%;margin-bottom:8px;">
              <option value="">-- Select the decoded intelligence after mapping the key --</option>
              <option value="wrong1">Aaliya planned to meet Ishita after closing hours</option>
              <option value="correct">Rishabh kept unlabeled poison vials and a 'T.S.P.' experiment ledger in his study</option>
              <option value="wrong2">Kirti stole keys from the café security guard</option>
            </select>
            <button class="action-btn primary" onclick="Game.checkPigpen()">Verify Pigpen Solution</button>
          </div>
          <div id="pigpen-fb"></div>
          <div class="nav-row"><button class="action-btn" onclick="Game.openEvidenceHub()">&larr; Back to Exhibits</button></div>
        `;
        this.openModal("EXHIBIT C — PIGPEN CIPHER DECODER", "ISHITA'S DIARY (OCTOBER 18, 2026)", html);
      },

      togglePigpenKey() {
        const box = document.getElementById("pigpen-key-box");
        box.style.display = box.style.display === "none" ? "grid" : "none";
      },

      applyPigpenKey() {
        document.getElementById("pigpen-key-box").style.display = "grid";
        document.getElementById("pigpen-decoded-box").style.display = "block";
      },

      checkPigpen() {
        const val = document.getElementById("pigpen-select").value;
        const fb = document.getElementById("pigpen-fb");
        if (val === "correct") {
          this.puzzles.pigpen = true;
          this.playClickSound(680);
          this.updateHUD();
          fb.innerHTML = `<div class="feedback-banner feedback-ok">PIGPEN DECODED: When Ishita visited Rishabh's house, she saw locked glass cabinets containing unlabeled chemical vials and a notebook signed "T.S.P."</div>`;
        } else {
          fb.innerHTML = `<div class="feedback-banner feedback-err">Map the custom Pigpen symbols using the recovered key first.</div>`;
        }
      },

      /* EXHIBIT D: REVERSED-TEXT DECODER */
      renderExhibitD() {
        const rawText = `P.S.T EFIL RUOY\nNI LLIRHT EHT UOY EVIG\nLLIW I\nREBMEMER`;
        const html = `
          <div class="dossier-paper">
            <h3>EXHIBIT D — RECOVERED SLIP OF PAPER (FOUND IN KIRTI'S POCKET)</h3>
            <pre style="font-family:'Courier New',monospace;font-size:18px;font-weight:bold;background:#e6dbc3;padding:12px;border-radius:4px;">${rawText}</pre>
            <p style="font-size:13px;color:#5c4528;"><i>Investigator Note: Found slipped into Kirti's apron pocket at the café. Do not assume the initials belong to Kirti without checking Exhibit E.</i></p>
          </div>

          <div class="nav-row">
            <button class="action-btn" onclick="Game.flipReversedText()">Flip & Reverse Word/Line Order</button>
          </div>
          <div id="rev-preview" class="cipher-box" style="display:none;color:#f7d594;"></div>

          <div style="margin-top:10px;">
            <input type="text" id="rev-input" style="width:100%;margin-bottom:8px;" placeholder="Enter reconstructed message..." value="${this.puzzles.reverse ? 'REMEMBER, I WILL GIVE YOU THE THRILL IN YOUR LIFE. T.S.P.' : ''}" />
            <button class="action-btn primary" onclick="Game.checkReverse()">Submit Reconstructed Note</button>
          </div>
          <div id="rev-fb"></div>
          <div class="nav-row"><button class="action-btn" onclick="Game.openEvidenceHub()">&larr; Back to Exhibits</button></div>
        `;
        this.openModal("EXHIBIT D — REVERSED-TEXT DECODER", "FOUND IN KIRTI'S POCKET", html);
      },

      flipReversedText() {
        const flipped = "REMEMBER, I WILL GIVE YOU THE THRILL IN YOUR LIFE. T.S.P.";
        const box = document.getElementById("rev-preview");
        box.style.display = "block";
        box.textContent = "Flipped Reading: " + flipped;
        document.getElementById("rev-input").value = flipped;
      },

      checkReverse() {
        const val = document.getElementById("rev-input").value.trim().toUpperCase().replace(/[^A-Z. ]/g, "");
        const fb = document.getElementById("rev-fb");
        if (val.includes("REMEMBER") && val.includes("THRILL IN YOUR LIFE") && val.includes("T.S.P")) {
          this.puzzles.reverse = true;
          this.playClickSound(660);
          this.updateHUD();
          fb.innerHTML = `<div class="feedback-banner feedback-ok">DECODED: "REMEMBER, I WILL GIVE YOU THE THRILL IN YOUR LIFE. T.S.P."<br/><span style="font-weight:normal;font-size:13px;">Check Exhibit E to verify who uses the alias "T.S.P."</span></div>`;
        } else {
          fb.innerHTML = `<div class="feedback-banner feedback-err">Reverse the letters of each word and read from bottom line to top line.</div>`;
        }
      },

      /* EXHIBIT E: CORROBORATING EVIDENCE (RISHABH'S NOTEBOOK PAGE + TOXICOLOGY) */
      renderExhibitE() {
        this.puzzles.exhibitE = true;
        this.updateHUD();
        const html = `
          <div class="dossier-paper">
            <h3>EXHIBIT E — RISHABH'S NOTEBOOK PAGE & TOXICOLOGY ADDENDUM</h3>
            <p><b>1. Recovered Torn Notebook Page (Found under Rishabh's seat at the large table):</b><br/>
            Contains the custom Pigpen symbol key used in Ishita's diary, alongside a handwritten motto:<br/>
            <i>"'Unique minds' transcend ordinary fear. Signed — <b>T.S.P. (The Silent Philosopher)</b>"</i></p>
            <p><b>2. Preliminary Toxicology & Physical Trace Addendum:</b><br/>
            • The frothy white foam mixed with blood and the overturned black coffee tested positive for fast-acting alkaloid poison (acting within 6–8 minutes of ingestion).<br/>
            • Kirti served uncontaminated black coffee at <b>9:05 PM</b> (which Ishita sipped safely for 10 minutes).<br/>
            • The Guard saw a male figure from the group table enter the rear alcove with a small silver dropper vial at <b>9:16 PM</b> and leave at <b>9:18 PM</b>.<br/>
            • Farhan confirmed <b>Rishabh's seat was empty at 9:15 PM</b>, directly disproving Rishabh's alibi that he "never left his seat after 9:00 PM."<br/>
            • At <b>9:24 PM</b> (within the <b>9:17 PM – 9:27 PM</b> murder window), the Guard heard the chair scrape and fall as the poison took effect.</p>
          </div>
          <div class="nav-row">
            <button class="action-btn" onclick="Game.openEvidenceHub()">&larr; Back to Exhibits</button>
            <button class="action-btn primary" onclick="Game.openTaskTwo()">Proceed to Final Accusation &rarr;</button>
          </div>
        `;
        this.openModal("EXHIBIT E — CORROBORATING EVIDENCE", "CIPHER KEY, ALIAS 'T.S.P.' & TOXICOLOGY", html);
      },

      /* ========================================================================
         PHASE 6 & 7: FINAL ACCUSATION & CASE RESOLUTION
         ======================================================================== */
      openTaskTwo() {
        if (!this.task1Solved) {
          this.openTaskOne();
          return;
        }
        const cards = SUSPECTS.map(s => `
          <div class="suspect-card ${this.selectedSuspect === s.id ? 'selected' : ''}" onclick="Game.selectSuspect('${s.id}')">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
              <div style="width:42px;height:42px;border-radius:50%;background:${s.color};border:2px solid #f7d594;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;">
                ${s.name[0]}
              </div>
              <div>
                <div style="font-weight:bold;font-size:16px;color:#f7d594;">${s.name}</div>
                <div style="font-size:12px;color:#9fb2cc;">${s.role}</div>
              </div>
            </div>
            <p style="font-size:13px;color:#dce5f2;margin:0 0 10px 0;">${s.desc}</p>
            <button class="action-btn" style="width:100%;padding:6px;">${this.selectedSuspect === s.id ? 'SELECTED' : 'SELECT SUSPECT'}</button>
          </div>
        `).join("");

        const html = `
          <div class="dossier-paper">
            <h3>FINAL TASK — WHO KILLED ISHITA RAO?</h3>
            <p>"You have the timeline. You have examined the hidden messages. You have compared the witness accounts.<br/>
            Now the evidence must lead to a conclusion.<br/>
            Who is responsible for Ishita Rao's death?"</p>
          </div>

          <div class="grid-2">${cards}</div>

          <div class="nav-row" style="margin-top:16px;">
            <button class="action-btn" onclick="Game.openEvidenceHub()">Review Evidence & Exhibits</button>
            <button class="action-btn primary" onclick="Game.submitAccusation()">SUBMIT FINAL ACCUSATION</button>
          </div>
          <div id="t2-feedback"></div>
        `;
        this.openModal("FINAL ACCUSATION — TASK 02", "FINAL TASK — WHO KILLED ISHITA RAO?", html);
      },

      selectSuspect(id) {
        this.selectedSuspect = id;
        this.openTaskTwo();
      },

      submitAccusation() {
        const fb = document.getElementById("t2-feedback");
        if (!this.selectedSuspect) {
          fb.innerHTML = `<div class="feedback-banner feedback-err">Select one suspect card before submitting your accusation.</div>`;
          return;
        }
        if (this.selectedSuspect === "rishabh") {
          this.task2Solved = true;
          this.playClickSound(840);
          this.updateHUD();
          this.openModal(
            "INVESTIGATION COMPLETE — CASE CLOSED",
            "CASE SOLVED",
            `
              <div class="feedback-banner feedback-ok" style="margin-bottom:14px;">
                <div style="font-size:18px;margin-bottom:6px;">CASE SOLVED</div>
                <p style="font-weight:normal;line-height:1.6;margin:0;">
                  "Rishabh. The evidence points to Rishabh.<br/>
                  The clues hidden in the recovered messages, the diary entries, and the corroborating evidence expose the connection that the others could not explain.<br/>
                  You have reconstructed the time of death and identified the person responsible.<br/>
                  Ishita Rao's case is solved.<br/>
                  Well done, Detective."
                </p>
              </div>
              <div class="dossier-paper">
                <h3>FINAL CASE SUMMARY</h3>
                <p>
                  • <b>Victim:</b> Ishita Rao<br/>
                  • <b>Discovery time:</b> 9:47 PM<br/>
                  • <b>Estimated murder window:</b> 9:17 PM–9:27 PM<br/>
                  • <b>Murderer:</b> Rishabh<br/>
                  • <b>Case status:</b> SOLVED
                </p>
                <p style="font-size:14px;color:#3d2b10;">
                  <b>Deduction Chain:</b> Rishabh lied about never leaving his seat after 9:00 PM (disproved by Farhan at 9:15 PM and the Guard at 9:16–9:18 PM, who saw him enter the rear alcove with a small vial). At 9:24 PM—inside the 9:17 PM–9:27 PM window—the poison took effect. His notebook key decoded Exhibit C and confirmed his alias "T.S.P." from the reversed note, while Aaliya's suspected DID and Kirti's alexithymia were red herrings rather than proof of guilt.
                </p>
              </div>
              <div class="nav-row">
                <button class="action-btn primary" onclick="Game.restartGame()">Restart Investigation</button>
                <button class="action-btn" onclick="Game.closeModal()">Explore Office</button>
              </div>
            `
          );
        } else {
          this.playClickSound(200);
          fb.innerHTML = `
            <div class="feedback-banner feedback-err">
              Your accusation does not fit the complete evidence. Revisit the recovered notes, compare the witness statements, and examine the connections between the clues.
            </div>
          `;
        }
      },

      restartGame() {
        this.phase = 1;
        this.readCase = false;
        this.readWitness = false;
        this.task1Solved = false;
        this.task2Solved = false;
        this.puzzles = { ascii: false, morse: false, pigpen: false, reverse: false, exhibitE: false };
        this.bookmarks.clear();
        this.selectedSuspect = null;
        this.clearBoardStrings();
        document.getElementById("evidence-tray").setAttribute("visible", "false");
        document.getElementById("btn-evidence").style.display = "none";
        document.getElementById("btn-task2").style.display = "none";
        document.getElementById("board-btn-t1").setAttribute("value", "TASK 01: TIME OF MURDER");
        document.getElementById("board-btn-t2").setAttribute("value", "TASK 02: ACCUSATION");
        this.updateHUD();
        this.openNarrationModal();
      }
    };

    /* ==========================================================================
       A-FRAME CUSTOM COMPONENTS (Meta Quest 3S Touch Controllers + Ray Interaction)
       ========================================================================== */
    AFRAME.registerComponent("hover-glow", {
      init() {
        this.el.addEventListener("mouseenter", () => {
          this.el.setAttribute("scale", "1.03 1.03 1.03");
        });
        this.el.addEventListener("mouseleave", () => {
          this.el.setAttribute("scale", "1 1 1");
        });
      }
    });

    AFRAME.registerComponent("vr-controller-helper", {
      schema: { hand: { type: "string", default: "right" } },
      init() {
        const el = this.el;
        this.snapCooldown = false;

        // Quest Touch Thumbstick: Left = Smooth/Comfort Move, Right = 30° Snap Turn
        el.addEventListener("thumbstickmoved", (evt) => {
          const rig = document.getElementById("player-rig");
          const cam = document.getElementById("player-camera");
          const { x, y } = evt.detail;

          if (this.data.hand === "left") {
            if (Math.abs(x) > 0.15 || Math.abs(y) > 0.15) {
              const yaw = cam.object3D.rotation.y;
              const speed = 0.045;
              const pos = rig.getAttribute("position");
              const nx = Math.max(-2.6, Math.min(2.6, pos.x + (Math.sin(yaw) * y + Math.cos(yaw) * x) * speed));
              const nz = Math.max(-1.4, Math.min(2.8, pos.z + (Math.cos(yaw) * y - Math.sin(yaw) * x) * speed));
              rig.setAttribute("position", `${nx.toFixed(3)} ${pos.y} ${nz.toFixed(3)}`);
            }
          } else if (this.data.hand === "right") {
            if (!this.snapCooldown && Math.abs(x) > 0.65) {
              const rot = rig.getAttribute("rotation");
              const delta = x > 0 ? -30 : 30;
              rig.setAttribute("rotation", `0 ${(rot.y + delta) % 360} 0`);
              this.snapCooldown = true;
              setTimeout(() => { this.snapCooldown = false; }, 280);
            }
          }
        });

        // Quest Menu / B / Y button toggles briefing or closes panels
        el.addEventListener("bbuttondown", () => Game.closeModal());
        el.addEventListener("ybuttondown", () => Game.openNarrationModal());
      }
    });

    /* Unified Click / VR Trigger Router for all 3D Interactables */
    document.addEventListener("DOMContentLoaded", () => {
      Game.init();

      document.querySelectorAll(".interactable").forEach(el => {
        el.addEventListener("click", () => {
          const action = el.getAttribute("data-action");
          if (action === "file-case") Game.openFile("case", 0);
          else if (action === "file-witness") Game.openFile("witness", 0);
          else if (action === "notes") Game.openNotebook();
          else if (action === "photo-cafe" || action === "photo-victim") Game.openFile("case", 1);
          else if (action === "board-node") Game.handleBoardNodeClick(el.getAttribute("data-node-id"));
          else if (action === "clear-strings") Game.clearBoardStrings();
          else if (action === "open-task1") Game.openTaskOne();
          else if (action === "open-exhibits") Game.openEvidenceHub();
          else if (action === "open-task2") Game.openTaskTwo();
          else if (action === "exhibit-A") Game.openExhibit("A");
          else if (action === "exhibit-B") Game.openExhibit("B");
          else if (action === "exhibit-C") Game.openExhibit("C");
          else if (action === "exhibit-D") Game.openExhibit("D");
          else if (action === "exhibit-E") Game.openExhibit("E");
          else if (action === "vr-close") Game.closeModal();
          else if (action === "vr-prev") {
            if (Game.vrState.mode === "case" || Game.vrState.mode === "witness") {
              Game.openFile(Game.vrState.mode, Math.max(0, Game.vrState.page - 1));
            }
          } else if (action === "vr-next") {
            if (Game.vrState.mode === "case" || Game.vrState.mode === "witness") {
              const maxP = (Game.vrState.mode === "case" ? CASE_FILE_PAGES : WITNESS_PAGES).length - 1;
              Game.openFile(Game.vrState.mode, Math.min(maxP, Game.vrState.page + 1));
            }
          } else if (action === "vr-action") {
            if (Game.vrState.mode === "narration") Game.openFile("case", 0);
            else if (Game.vrState.mode === "case") Game.openFile("witness", 0);
            else if (Game.vrState.mode === "witness") Game.openTaskOne();
          }
        });
      });

      /* Desktop Keyboard Shortcuts */
      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.key === "Escape") {
          const modal = document.getElementById("modal-backdrop");
          if (modal.style.display === "flex") Game.closeModal();
          else Game.openNarrationModal();
        } else if (e.key === "1") {
          Game.openFile("case", 0);
        } else if (e.key === "2") {
          Game.openFile("witness", 0);
        } else if (e.key === "3") {
          Game.openTaskOne();
        }
      });
    });
  </script>
